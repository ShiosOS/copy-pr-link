version: 2
updates:
  # npm dev tooling
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions (kept pinned to SHAs; Dependabot bumps the SHA + comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
