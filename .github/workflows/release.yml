name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched on the new tag by the Prepare Release workflow: tags pushed
  # with GITHUB_TOKEN don't fire `push` triggers (recursion protection).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the zip
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package.json and manifest.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            const version = (file) =>
              JSON.parse(readFileSync(file, "utf8")).version;
            const pkg = version("package.json");
            const manifest = version("manifest.json");
            if (pkg !== tag || manifest !== tag) {
              console.error(
                `Version mismatch: tag v${tag}, package.json ${pkg}, manifest.json ${manifest}`,
              );
              process.exit(1);
            }
            console.log(`Release version ${tag} is consistent.`);
          '

      - run: npm ci

      - name: Verify (lint, type-check, test)
        run: npm run check

      - name: Build extension package
        run: npm run build

      # ---------------------------------------------------------------------
      # Optional store publishing. Each step runs only when its credentials
      # exist as repository Actions secrets (Settings → Secrets and variables
      # → Actions); without them, releases stay GitHub-only. See the README's
      # "Publishing to the browser stores" section for the one-time setup.
      # ---------------------------------------------------------------------

      # Submits the build to addons.mozilla.org for signing and downloads the
      # Mozilla-signed .xpi into dist/, so it gets attached to the GitHub
      # release below. The unlisted channel is self-hosted distribution: the
      # .xpi installs permanently in regular Firefox without an AMO listing.
      # Switch --channel to "listed" to publish on addons.mozilla.org instead.
      - name: Sign for Firefox (AMO)
        if: ${{ secrets.AMO_JWT_ISSUER != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --no-install web-ext sign --channel unlisted --artifacts-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.xpi
          generate_release_notes: true

      # Uploads and publishes the new version to the Chrome Web Store. The
      # listing must already exist (the very first submission is manual).
      - name: Publish to the Chrome Web Store
        if: ${{ secrets.CHROME_REFRESH_TOKEN != '' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx --no-install chrome-webstore-upload --source dist/*.zip
