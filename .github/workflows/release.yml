name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched on the new tag by the Prepare Release workflow: tags pushed
  # with GITHUB_TOKEN don't fire `push` triggers (recursion protection).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the zip
    env:
      # Hoisted to the job so the store step can gate itself on whether the
      # credentials exist. `secrets` is not a valid context in a step's `if:`
      # — only in `env`, `with`, and `run` — and referencing it there makes
      # the whole workflow file unparseable, so it must be read via `env`.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package.json and manifest.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            const version = (file) =>
              JSON.parse(readFileSync(file, "utf8")).version;
            const pkg = version("package.json");
            const manifest = version("manifest.json");
            if (pkg !== tag || manifest !== tag) {
              console.error(
                `Version mismatch: tag v${tag}, package.json ${pkg}, manifest.json ${manifest}`,
              );
              process.exit(1);
            }
            console.log(`Release version ${tag} is consistent.`);
          '

      - run: npm ci

      - name: Verify (lint, type-check, test)
        run: npm run check

      - name: Build extension package
        run: npm run build

      # ---------------------------------------------------------------------
      # Optional store publishing. The AMO step runs only when its credentials
      # exist as repository Actions secrets (Settings → Secrets and variables
      # → Actions); without them, releases stay GitHub-only. Chrome is not
      # automated. See RELEASING.md for the one-time setup of each.
      # ---------------------------------------------------------------------

      # The GitHub Release comes first deliberately. Prepare Release has
      # already committed the version bump and pushed the tag by this point,
      # so a store submission that fails here would otherwise leave a tagged
      # version with no release to download. Publishing first keeps a store
      # outage an isolated, re-runnable problem.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true

      # Submits the build to addons.mozilla.org on the listed channel, which
      # publishes it on the public AMO listing after Mozilla's review. Listed
      # submissions don't hand back a signed file — AMO serves the .xpi from
      # the listing — so nothing is added to the GitHub Release above. The
      # listing itself must already exist; see RELEASING.md.
      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        env:
          WEB_EXT_API_KEY: ${{ env.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ env.AMO_JWT_SECRET }}
        run: npx --no-install web-ext sign --channel listed --artifacts-dir dist

      # Chrome is deliberately NOT automated: its API needs a Google Cloud
      # OAuth client and a refresh token that Google revokes on its own
      # schedule, which is more upkeep than the upload saves. Upload the zip
      # from the GitHub Release by hand — see RELEASING.md.
