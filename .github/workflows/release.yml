name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the zip
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package.json and manifest.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            const version = (file) =>
              JSON.parse(readFileSync(file, "utf8")).version;
            const pkg = version("package.json");
            const manifest = version("manifest.json");
            if (pkg !== tag || manifest !== tag) {
              console.error(
                `Version mismatch: tag v${tag}, package.json ${pkg}, manifest.json ${manifest}`,
              );
              process.exit(1);
            }
            console.log(`Release version ${tag} is consistent.`);
          '

      - run: npm ci

      - name: Verify (lint, type-check, test)
        run: npm run check

      - name: Build extension package
        run: npm run build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*.zip
          generate_release_notes: true
