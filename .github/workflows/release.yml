name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched on the new tag by the Prepare Release workflow: tags pushed
  # with GITHUB_TOKEN don't fire `push` triggers (recursion protection).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the zip
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package.json and manifest.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            const version = (file) =>
              JSON.parse(readFileSync(file, "utf8")).version;
            const pkg = version("package.json");
            const manifest = version("manifest.json");
            if (pkg !== tag || manifest !== tag) {
              console.error(
                `Version mismatch: tag v${tag}, package.json ${pkg}, manifest.json ${manifest}`,
              );
              process.exit(1);
            }
            console.log(`Release version ${tag} is consistent.`);
          '

      - run: npm ci

      - name: Verify (lint, type-check, test)
        run: npm run check

      - name: Build extension package
        run: npm run build

      # ---------------------------------------------------------------------
      # Optional store publishing. Each step runs only when its credentials
      # exist as repository Actions secrets (Settings → Secrets and variables
      # → Actions); without them, releases stay GitHub-only. See the README's
      # "Publishing to the browser stores" section for the one-time setup.
      # ---------------------------------------------------------------------

      # Submits the build to addons.mozilla.org on the listed channel, which
      # publishes it on the public AMO listing after Mozilla's review. Listed
      # submissions don't hand back a signed file (AMO serves it from the
      # listing), so no .xpi lands in dist/ — the glob below tolerates that.
      # The listing itself must already exist; see RELEASING.md.
      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ secrets.AMO_JWT_ISSUER != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --no-install web-ext sign --channel listed --artifacts-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.xpi
          # dist/*.xpi matches nothing on the listed channel (see above); an
          # unmatched glob must warn, not fail the release.
          fail_on_unmatched_files: false
          generate_release_notes: true

      # Chrome is deliberately NOT automated: its API needs a Google Cloud
      # OAuth client and a refresh token that Google revokes on its own
      # schedule, which is more upkeep than the upload saves. Upload the zip
      # from the GitHub Release by hand — see RELEASING.md.
